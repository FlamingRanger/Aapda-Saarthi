services:
  - type: web
    name: aapdasaarthi-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: HOST
        value: "0.0.0.0"
      - key: CORS_ORIGINS
        value: "https://aapdasaarthi.vercel.app,https://aapda-saarthi.vercel.app"
      - key: SECRET_KEY
        generateValue: true

